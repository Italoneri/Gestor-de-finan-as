; Production overrides for the php:8.2-apache defaults. The zz- prefix in the
; installed filename makes this the last conf.d file PHP reads.

; Sessions belong on the persisted volume. The stock save_path is the
; container's /tmp, so every restart would silently log all users out.
session.save_path = /var/www/html/storage/sessions

; No reason to advertise the PHP version in response headers.
expose_php = Off

; ErrorHandler::register() sets these per request as well; repeating them here
; also covers failures that happen before the handler is installed.
display_errors = Off
display_startup_errors = Off
log_errors = On

; The code is baked into the image and cannot change at runtime, so checking
; file mtimes on every request buys nothing. Trade-off: deploying a code change
; requires rebuilding the image, not just restarting the container.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
