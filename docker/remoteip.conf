# Apache runs behind Caddy, so REMOTE_ADDR would be the proxy's container
# address on every request. LoginRateLimiter buckets failed logins by IP
# (src/Services/LoginRateLimiter.php), and one shared address means 20 wrong
# passwords from anybody lock out the whole site for 15 minutes.
RemoteIPHeader X-Forwarded-For

# Only the compose network is allowed to set that header. Without this
# allowlist any client could forge X-Forwarded-For and skip the rate limiter
# entirely by sending a different value on each attempt.
#
# The range sits outside Docker's default auto-assignment pool (172.17-172.31)
# on purpose: a network that happened to be handed this subnet would inherit
# the trust granted here.
RemoteIPTrustedProxy 10.89.0.0/24
